<script>
// The predictions built into this page are from 2026-10-25T18:01:16Z. If the app has since fetched newer ones

window.__lbBuilt = '2026-10-25T18:01:16Z';
window.__lbFresh = function () {
  try {
    var s = JSON.parse(localStorage.getItem('lineboard:fresh') || 'null');
    if (s && s.stamp > window.__lbBuilt && s.leagues) { window.__lbBuilt = s.stamp; return s.leagues; }
  } catch (e) {}
  return null;
};

<body>
<title>NBL, NBA &amp; NFL Line Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=IBM+Plex+Mono:wght@400;600&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: league tabs (NBL orange over a faint court arc, NBA royal blue over faint hardwood planks,
   NFL turf green over faint yard lines, CFB crimson on parchment over faint pennant pinstripes), then a
   scoreboard of game cards.
   Summary rail first, then one card per game: head-to-head pair and the case for each side on the
   left, alt-line calculator on the right, then a total-points band (projection and reasons on the
   left, over/under calculator on the right). Cards stack to one column under 860px. */
:root {
  --bg: #eef1f4; --surface: #ffffff; --surface-2: #f6f8fa; --ink: #14202c; --muted: #5a6978; --line: #d6dde4;
  --accent: #c94f1c; --accent-ink: #ffffff; --accent-soft: #fae5da;
  --away: #3f5f86; --home: #c94f1c;
  --good: #187a4b; --good-soft: #dcf1e5; --warn: #9a6200; --warn-soft: #fbeed3; --bad: #b0281f; --bad-soft: #f8dfdc;
  --display: 'Big Shoulders Display', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --body: 'Public Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --radius: 10px;
  --nbl: #c94f1c; --nba: #1d4ea3; --nfl: #2a7a3b; --cfb: #9e1b32;
  --pattern: color-mix(in srgb, var(--accent) 12%, transparent);
  --over: var(--accent); --under: color-mix(in srgb, var(--ink) 50%, transparent);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e141a; --surface: #161f28; --surface-2: #1c2732; --ink: #e5ebf1; --muted: #93a2b1; --line: #2b3846;
  --accent: #f07a42; --accent-ink: #1a0d06; --accent-soft: #3b2216; --away: #8fb1da; --home: #f07a42;
  --good: #52c690; --good-soft: #143022; --warn: #e3aa40; --warn-soft: #33270f; --bad: #f1786f; --bad-soft: #3b1b19;
  --nbl: #f07a42; --nba: #7aa7f5; --nfl: #5cc27a; --cfb: #e66a7d;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e141a; --surface: #161f28; --surface-2: #1c2732; --ink: #e5ebf1; --muted: #93a2b1; --line: #2b3846;
  --accent: #f07a42; --accent-ink: #1a0d06; --accent-soft: #3b2216; --away: #8fb1da; --home: #f07a42;
  --good: #52c690; --good-soft: #143022; --warn: #e3aa40; --warn-soft: #33270f; --bad: #f1786f; --bad-soft: #3b1b19;
  --nbl: #f07a42; --nba: #7aa7f5; --nfl: #5cc27a; --cfb: #e66a7d;
  color-scheme: dark; }
/* NBA tab: same layout, royal blue on cool white */
:root[data-league="nba"] {
  --bg: #eceff6; --surface: #ffffff; --surface-2: #f4f6fb; --ink: #121a2c; --muted: #56627a; --line: #d3d9e6;
  --accent: #1d4ea3; --accent-ink: #ffffff; --accent-soft: #dde6f6; --away: #b23a2e; --home: #1d4ea3; }
@media (prefers-color-scheme: dark) { :root[data-league="nba"]:not([data-theme="light"]) {
  --bg: #0b1020; --surface: #131a2c; --surface-2: #192236; --ink: #e3e8f3; --muted: #93a0b9; --line: #273250;
  --accent: #7aa7f5; --accent-ink: #07132b; --accent-soft: #1a2a4d; --away: #f08a7e; --home: #7aa7f5; } }
:root[data-league="nba"][data-theme="dark"] {
  --bg: #0b1020; --surface: #131a2c; --surface-2: #192236; --ink: #e3e8f3; --muted: #93a0b9; --line: #273250;
  --accent: #7aa7f5; --accent-ink: #07132b; --accent-soft: #1a2a4d; --away: #f08a7e; --home: #7aa7f5; }
/* NFL tab: same layout, turf-green palette */
:root[data-league="nfl"] {
  --bg: #eaf0e9; --surface: #ffffff; --surface-2: #f3f7f2; --ink: #13201a; --muted: #566a5c; --line: #d1dcd0;
  --accent: #2a7a3b; --accent-ink: #ffffff; --accent-soft: #dbeedd; --away: #3f5f86; --home: #2a7a3b; }
@media (prefers-color-scheme: dark) { :root[data-league="nfl"]:not([data-theme="light"]) {
  --bg: #0b130e; --surface: #131e17; --surface-2: #19261d; --ink: #e2ece4; --muted: #8fa596; --line: #26382c;
  --accent: #5cc27a; --accent-ink: #05140a; --accent-soft: #15301e; --away: #8fb1da; --home: #5cc27a; } }
:root[data-league="nfl"][data-theme="dark"] {
  --bg: #0b130e; --surface: #131e17; --surface-2: #19261d; --ink: #e2ece4; --muted: #8fa596; --line: #26382c;
  --accent: #5cc27a; --accent-ink: #05140a; --accent-soft: #15301e; --away: #8fb1da; --home: #5cc27a; }
/* CFB tab: crimson on parchment, like an old game-day programme */
:root[data-league="cfb"] {
  --bg: #f2ede4; --surface: #fffdf9; --surface-2: #f7f2ea; --ink: #23160f; --muted: #6d5c50; --line: #e0d6c8;
  --accent: #9e1b32; --accent-ink: #ffffff; --accent-soft: #f5dfe2; --away: #3f5f86; --home: #9e1b32; }
@media (prefers-color-scheme: dark) { :root[data-league="cfb"]:not([data-theme="light"]) {
  --bg: #160d0e; --surface: #211517; --surface-2: #2a1b1d; --ink: #f0e6e2; --muted: #b39f97; --line: #3d2a2c;
  --accent: #e66a7d; --accent-ink: #22070c; --accent-soft: #40191f; --away: #8fb1da; --home: #e66a7d; } }
:root[data-league="cfb"][data-theme="dark"] {
  --bg: #160d0e; --surface: #211517; --surface-2: #2a1b1d; --ink: #f0e6e2; --muted: #b39f97; --line: #3d2a2c;
  --accent: #e66a7d; --accent-ink: #22070c; --accent-soft: #40191f; --away: #8fb1da; --home: #e66a7d; }
body { background-color: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); border-top: 4px solid var(--accent);
  background-attachment: fixed; background-repeat: no-repeat;
  /* NBL: a three-point arc and the circle at the top of the key, in the corner */
  background-image: radial-gradient(circle at calc(100% + 40px) -40px, transparent 0 262px, var(--pattern) 262px 265px, transparent 265px),
    radial-gradient(circle at calc(100% + 40px) -40px, transparent 0 112px, var(--pattern) 112px 115px, transparent 115px); }
/* NBA: hardwood planks, with staggered board ends */
:root[data-league="nba"] body { background-repeat: repeat;
  background-image: repeating-linear-gradient(0deg, transparent 0 34px, var(--pattern) 34px 35px),
    repeating-linear-gradient(90deg, transparent 0 239px, color-mix(in srgb, var(--accent) 6%, transparent) 239px 240px); }
/* NFL: a yard line every tenth of the screen */
:root[data-league="nfl"] body { background-repeat: repeat;
  background-image: repeating-linear-gradient(90deg, transparent 0 calc(10vw - 2px), var(--pattern) calc(10vw - 2px) 10vw); }
/* CFB: diagonal pennant pinstripes */
:root[data-league="cfb"] body { background-repeat: repeat;
  background-image: repeating-linear-gradient(135deg, transparent 0 26px, var(--pattern) 26px 28px); }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: grid; gap: 18px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.eyebrow { font: 600 11px/1.2 var(--body); letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
.top { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: end; justify-content: space-between; }
.brand h1 { font: 800 clamp(34px, 6vw, 52px)/0.95 var(--display); letter-spacing: .01em; text-transform: uppercase; }
.brand h1 span { color: var(--accent); }
.brand p { margin: 6px 0 0; color: var(--muted); font-size: 13px; max-width: 62ch; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.edge { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 8px 6px 14px; }
.edge label { font-size: 13px; color: var(--muted); }
.edge input { width: 64px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 4px 8px; text-align: center; }
.banner { background: var(--warn-soft); color: var(--ink); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); border-radius: var(--radius); padding: 10px 14px; font-size: 13px; }
.banner b { color: var(--warn); }
.tabs { display: inline-flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); justify-self: start; }
.tabs button { border: 0; background: transparent; border-radius: 999px; padding: 8px 16px 7px 12px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
  font: 800 18px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.tabs button::before { content: ''; width: 9px; height: 9px; border-radius: 50%; background: var(--dot); }
.tabs button[data-league="nbl"] { --dot: var(--nbl); } .tabs button[data-league="nfl"] { --dot: var(--nfl); }
.tabs button[data-league="nba"] { --dot: var(--nba); }
.tabs button[data-league="cfb"] { --dot: var(--cfb); }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.tabs button[aria-selected="true"]::before { background: var(--accent-ink); }
.tabs button:not([aria-selected="true"]):not(:disabled):hover { color: var(--ink); }
.tabs button:disabled { cursor: not-allowed; opacity: .5; }

/* summary rail */
.rail { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; min-width: 0; }
.panel h2 { font: 700 13px/1.2 var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
.bestlist { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.bestlist li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); }
.bestlist .what { min-width: 0; }
.bestlist .what b { font-weight: 700; }
.bestlist .what small { display: block; color: var(--muted); font-size: 12px; }
.empty { color: var(--muted); font-size: 13px; margin: 0; }
.playbook { margin: -4px 0 10px; color: var(--ink); }

/* game card */
.games { display: grid; gap: 18px; }
.game { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.ghead { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px 18px; padding: 14px 18px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.meta { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 12px; }
.matchup { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; margin-top: 4px; }
.team { font: 800 clamp(24px, 4vw, 32px)/1 var(--display); text-transform: uppercase; letter-spacing: .01em; }
.team.away { color: var(--away); } .team.home { color: var(--home); }
.at { font: 600 16px var(--display); color: var(--muted); }
.rec { font: 500 12px var(--mono); color: var(--muted); }
.form { display: inline-flex; gap: 2px; vertical-align: middle; }
.form i { width: 14px; height: 14px; border-radius: 3px; font: 600 9px/14px var(--mono); text-align: center; font-style: normal; }
.form i.W { background: var(--good-soft); color: var(--good); } .form i.L { background: var(--bad-soft); color: var(--bad); }
.form i.T { background: var(--surface); color: var(--muted); }
.flags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.flag { font-size: 12px; line-height: 1.35; padding: 5px 9px; border-radius: 6px; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); }
.flag b { color: var(--accent); font-weight: 700; }
.flag.wind { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 35%, transparent); } .flag.wind b { color: var(--warn); }
.flag.soft { background: var(--surface); border-color: var(--line); color: var(--muted); } .flag.soft b { color: var(--ink); }
.verdict { text-align: right; display: grid; gap: 4px; justify-items: end; align-content: start; }
.verdict .proj { font: 800 22px/1 var(--display); text-transform: uppercase; }
.sig { display: inline-flex; align-items: end; gap: 3px; height: 18px; }
.sig i { width: 6px; border-radius: 2px; background: var(--line); }
.sig i:nth-child(1) { height: 6px; } .sig i:nth-child(2) { height: 9px; } .sig i:nth-child(3) { height: 12px; } .sig i:nth-child(4) { height: 15px; } .sig i:nth-child(5) { height: 18px; }
.sig i.on { background: var(--accent); }
.siglabel { font-size: 12px; color: var(--muted); }
.split { grid-column: 1 / -1; display: grid; gap: 4px; }
.bar { display: flex; height: 10px; border-radius: 999px; overflow: hidden; background: var(--line); }
.bar span:first-child { background: var(--away); } .bar span:last-child { background: var(--home); }
.barlab { display: flex; justify-content: space-between; font: 600 13px var(--mono); }
.barlab .a { color: var(--away); } .barlab .h { color: var(--home); }

.gbody { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); }
.gbody > section { padding: 16px 18px; min-width: 0; }
.gbody > section + section { border-left: 1px solid var(--line); }
.sec-title { font: 700 12px/1.2 var(--body); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; display: flex; justify-content: space-between; gap: 8px; }
.h2h { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.side { border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.side.pick { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); box-shadow: inset 0 3px 0 var(--accent); }
.side-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.side-top h3 { font: 800 20px/1 var(--display); text-transform: uppercase; }
.tag { font: 600 10px/1 var(--body); letter-spacing: .08em; text-transform: uppercase; padding: 4px 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
.prices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.prices div { background: var(--surface-2); border-radius: 8px; padding: 6px 8px; min-width: 0; }
.prices dt { font-size: 11px; color: var(--muted); }
.prices dd { margin: 0; font: 600 17px/1.2 var(--mono); font-variant-numeric: tabular-nums; }
.prices .take dd { color: var(--accent); }
.oddsrow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.stake { display: grid; justify-items: center; min-width: 64px; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); line-height: 1.15; }
.stake b { font: 600 15px var(--mono); font-variant-numeric: tabular-nums; color: var(--muted); }
.stake small { font: 600 9px/1.2 var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.stake.on { background: var(--good-soft); border-color: color-mix(in srgb, var(--good) 45%, transparent); }
.stake.on b { color: var(--good); }
.stakeset input { width: 52px; }
.stakeset #kbank { width: 68px; }
.oddsrow label { font-size: 12px; color: var(--muted); }
.oddsrow input { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 7px 9px; font-family: var(--mono); }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 600 12px/1 var(--body); padding: 6px 9px; border-radius: 999px; }
.chip.good { background: var(--good-soft); color: var(--good); } .chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); } .chip.none { background: var(--surface-2); color: var(--muted); }
.valuebox { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.bk { font-weight: 700; color: var(--ink); }
.case { display: grid; gap: 8px; font-size: 13px; }
.case h4 { margin: 0 0 2px; font: 600 11px/1.2 var(--body); letter-spacing: .08em; text-transform: uppercase; }
.case .for h4 { color: var(--good); } .case .against h4 { color: var(--bad); }
.case ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; }
.case li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.case li span:last-child { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.summary { font-size: 13px; margin: 0; }

/* alt lines */
.alt { display: grid; gap: 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--surface-2); }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.pickers { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.pickers select { border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; padding: 7px 10px; font-family: var(--mono); }
.altout { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.altout div { background: var(--surface-2); border-radius: 8px; padding: 6px 8px; min-width: 0; }
.altout dt { font-size: 11px; color: var(--muted); }
.altout dd { margin: 0; font: 600 16px/1.2 var(--mono); font-variant-numeric: tabular-nums; }
.altout .take dd { color: var(--accent); }
.dist { width: 100%; height: auto; display: block; }
.dist text { font: 11px var(--mono); fill: var(--muted); }
details { border-top: 1px solid var(--line); }
details > summary { cursor: pointer; padding: 10px 18px; font: 600 13px var(--body); color: var(--muted); list-style: none; display: flex; justify-content: space-between; }
details > summary::-webkit-details-marker { display: none; }
details > summary::after { content: '+'; font-family: var(--mono); }
details[open] > summary::after { content: '\2212'; }
.dbody { padding: 0 18px 16px; display: grid; gap: 14px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: right; padding: 5px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
th:first-child, td:first-child { text-align: left; }
th { font: 600 11px var(--body); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
td.num, td .num { font-family: var(--mono); }
tr.near td { background: var(--accent-soft); }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--surface-2); }
.drivers { display: grid; gap: 5px; }
.drv { display: grid; grid-template-columns: 130px minmax(0, 1fr) 54px; gap: 8px; align-items: center; font-size: 12px; }
.drv .track { position: relative; height: 10px; background: var(--surface-2); border-radius: 3px; }
.drv .track::before { content: ''; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--line); }
.drv .fill { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.drv .fill.h { background: var(--home); left: 50%; } .drv .fill.a { background: var(--away); right: 50%; }
.drv span:last-child { font-family: var(--mono); text-align: right; }
.drv .fill.o { background: var(--over); left: 50%; } .drv .fill.u { background: var(--under); right: 50%; }
.cols2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }

/* total points band */
.gbody.tot { border-top: 1px solid var(--line); }
.tothead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; margin-bottom: 8px; }
.totbig { font: 800 40px/1 var(--display); letter-spacing: .01em; }
.totbig small { font: 600 13px var(--body); color: var(--muted); letter-spacing: 0; margin-left: 4px; }
.score { font: 600 15px var(--mono); }
.score .a { color: var(--away); } .score .h { color: var(--home); }
.range { font-size: 12px; color: var(--muted); margin: 0 0 10px; }

/* game filter and sort (every tab) */
.filter { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
.filter input, .filter select, .clearf { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 14px; min-width: 0; max-width: 100%; }
.filter input { flex: 1 1 200px; max-width: 320px; }
.clearf { cursor: pointer; color: var(--muted); }
.clearf:hover { color: var(--ink); }
.filter .small { margin-left: auto; }

/* strength of a chosen line or total */
.strength { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 10px; font-size: 13px; }
.strength b { font-weight: 700; }
.strength .small { flex-basis: 100%; }
.strength.against b { color: var(--bad); }
.lean { color: var(--muted); }
.lean b { color: var(--ink); font-weight: 600; }
.rank { font: 600 13px var(--mono); color: var(--muted); margin-right: -6px; }
[hidden] { display: none !important; }
.small { font-size: 12px; color: var(--muted); }
.list { margin: 0; padding-left: 16px; font-size: 13px; display: grid; gap: 2px; }
footer { color: var(--muted); font-size: 12px; display: grid; gap: 4px; }

@media (max-width: 860px) {
  .rail, .gbody, .cols2 { grid-template-columns: minmax(0, 1fr); }

}

// The bookmaker a price came from, when the odds check page filled it in and it hasn't been changed since

    return b && o !== '' && +b.odds === +o ? b : null;

// cut = the line on the value axis; the shaded side wins the bet (right = above the line).
function distSVG(mu, sigma, cut, color, right = true, signed = true, label = 'Spread of likely margins with the selected line') {
  const W = 360, H = 120, pad = 18, hi = Math.ceil((mu + 3.2 * sigma) / 10) * 10;
  const lo = signed ? Math.floor((mu - 3.2 * sigma) / 10) * 10 : Math.max(0, Math.floor((mu - 3.2 * sigma) / 10) * 10);
  const X = v => pad + (v - lo) / (hi - lo) * (W - 2 * pad);
  const pdf = v => Math.exp(-0.5 * ((v - mu) / sigma) ** 2);
  const Y = d => H - 22 - d * (H - 34);
  let line = '', area = '';
  for (let v = lo; v <= hi + 1e-9; v += 0.5) { line += `${v === lo ? 'M' : 'L'}${X(v).toFixed(1)},${Y(pdf(v)).toFixed(1)}`; }
  const a0 = right ? Math.min(Math.max(cut, lo), hi) : lo, a1 = right ? hi : Math.max(Math.min(cut, hi), lo);
  area = `M${X(a0).toFixed(1)},${Y(0)}`;
  for (let v = a0; v <= a1 + 1e-9; v += 0.5) area += `L${X(v).toFixed(1)},${Y(pdf(v)).toFixed(1)}`;
  area += `L${X(a1).toFixed(1)},${Y(0)}Z`;
  let ticks = '';
  for (let v = lo; v <= hi; v += 10) ticks += `<line x1="${X(v)}" x2="${X(v)}" y1="${Y(0)}" y2="${Y(0) + 4}" stroke="var(--line)"/><text x="${X(v)}" y="${H - 4}" text-anchor="middle">${signed && v > 0 ? '+' + v : v}</text>`;
  const cx = Math.min(Math.max(X(cut), pad), W - pad);
  return `<svg class="dist" viewBox="0 0 ${W} ${H}" role="img" aria-label="${label}">
    <line x1="${pad}" x2="${W - pad}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--line)"/>
    <path d="${area}" fill="${color}" fill-opacity="0.22"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2"/>
    <line x1="${cx}" x2="${cx}" y1="8" y2="${Y(0)}" stroke="var(--ink)" stroke-dasharray="3 3"/>
    <line x1="${X(mu)}" x2="${X(mu)}" y1="${Y(1)}" y2="${Y(0)}" stroke="${color}" stroke-opacity="0.5"/>
    ${ticks}
  </svg>`;
}

    </div>

}

function stakeTag(i) {
  const k = kelly(i.q, i.odds, i.market || 'h2h');
  return k && k.units > 0 ? ` · ${fmtU(k.units)}u` : '';
}
function best() {
  sharedNote();
  const items = [];
  for (const gm of DATA.games) {
    for (const key of ['away', 'home']) {
      const odds = +store.get(`${gm.id}:h2h:${key}`, '');
      if (odds > 1) { const q = { win: gm[key].win, push: 0 }; items.push({ gm, q, what: `${gm[key].short} to win`, odds, e: ev(q, odds), p: q.win, bars: gm.pick === key ? gm.signal.bars : 1, book: bookOf(gm, 'h2h', key), bk: backup(gm, 'h2h', key) }); }
    }
    const st = store.get(`${gm.id}:alt`, null);
    if (st && +st.odds > 1) {
      const mu = st.side === 'home' ? gm.margin : -gm.margin, q = lineProb(mu, gm.sigma, st.line);
      items.push({ gm, q, market: 'line', what: `${gm[st.side].short} ${lineLabel(st.line)}`, odds: +st.odds, e: ev(q, +st.odds), p: q.win,
                   bars: lineStrength(q, DATA.line_bands, gm.signal.uncertain).bars, book: bookOf(gm, 'alt'), bk: backup(gm, 'alt') });
    }
    const tt = hasTot(gm) ? store.get(`${gm.id}:tot`, null) : null;
    if (tt && +tt.odds > 1) {
      const q = totProb(gm.total, gm.total_sigma, tt.line, tt.side);
      items.push({ gm, q, market: 'total', what: totLabel(tt.side, tt.line), odds: +tt.odds, e: ev(q, +tt.odds), p: q.win,
                   bars: lineStrength(q, DATA.total_bands, gm.signal.uncertain).bars, book: bookOf(gm, 'tot'), bk: backup(gm, 'tot') });
    }
  }
  const el = $('#best');
  const good = items.filter(i => i.e >= EDGE).sort((a, b) => b.e - a.e);
  if (good.length) {
    el.innerHTML = good.map(i => `<li><div class="what"><b>${esc(i.what)}</b> @ <span class="num">${i.odds.toFixed(2)}</span>${i.book ? ` <span class="bk">${esc(i.book)}</span>` : ''}<small>${esc(i.gm.away.short)} at ${esc(i.gm.home.short)} · ${esc(i.gm.tip)} · model ${pct(i.p)}${i.bk ? ` · backup ${esc(i.bk.name)} ${esc(i.bk.what)} @ ${i.bk.odds.toFixed(2)} (${sgn(i.bk.e)})` : ''}</small></div>${sigBars(i.bars)}<span class="chip good">+${pct(i.e, 1)}${stakeTag(i)}</span></li>`).join('');
    return;
  }
  const rules = DATA.games.filter(g => (g.flags || []).some(x => x.kind === 'rule'));
  // near-certain favourites (90%+) make poor suggestions, so leave them out when there are other games
  const pool = DATA.games.filter(g => !rules.includes(g) && Math.max(g.home.win, g.away.win) < 0.9);
  const top = (pool.length ? pool : DATA.games.filter(g => !rules.includes(g))).sort((a, b) => b.signal.bars - a.signal.bars || Math.max(b.home.win, b.away.win) - Math.max(a.home.win, a.away.win)).slice(0, Math.max(1, 3 - rules.length));
  const per = esc((DATA.period || 'round').toLowerCase());
  el.innerHTML = `<li style="background:none;padding:0 0 4px"><p class="empty">${items.length ? 'None of the prices you entered clear your minimum edge yet.' : 'Enter bookmaker prices below and the bets that clear your minimum edge appear here.'} ${rules.length ? `Underdog-rule bets this ${per}, then the strongest signals:` : `Strongest signals this ${per}:`}</p></li>` +
    rules.map(gm => { const p = gm[gm.pick]; const fl = gm.flags.find(x => x.kind === 'rule'); return `<li><div class="what"><b>${esc(p.short)}</b> ${pct(p.win)}<small>${esc(gm.away.short)} at ${esc(gm.home.short)} · ${esc(gm.tip)} · ${esc(fl.short || fl.text)}</small></div>${sigBars(gm.signal.bars)}<span class="chip good">Underdog rule</span></li>`; }).join('') +
    top.map(gm => { const p = gm[gm.pick]; const q = { win: p.win, push: 0 }; return `<li><div class="what"><b>${esc(p.short)}</b> ${pct(p.win)}<small>${esc(gm.away.short)} at ${esc(gm.home.short)} · ${esc(gm.tip)} · take at ${fmtOdds(takeOdds(q))}+</small></div>${sigBars(gm.signal.bars)}<span class="chip none">${esc(gm.signal.level)}</span></li>`; }).join('');
}

function wire(card, gm) {
  card.addEventListener('input', ev_ => {
    const t = ev_.target;
    if (t.dataset.odds) {
      store.set(`${gm.id}:${t.dataset.odds}`, t.value);
      const key = t.dataset.odds.split(':')[1];
      $(`[data-val="${t.dataset.odds}"]`, card).innerHTML = valueHTML(verdict({ win: gm[key].win, push: 0 }, +t.value), +t.value, bookOf(gm, 'h2h', key), backupHTML(gm, 'h2h', key));
      setStake($(`[data-stake="${t.dataset.odds}"]`, card), { win: gm[key].win, push: 0 }, +t.value);
      best();
    } else if (t.matches('[data-altodds]')) {
      const st = altState(gm); st.odds = t.value; store.set(`${gm.id}:alt`, st); renderAlt(card, gm); best();
    } else if (t.matches('[data-totodds]')) {
      const st = totState(gm); st.odds = t.value; store.set(`${gm.id}:tot`, st); renderTot(card, gm); best();
    }
  });
  card.addEventListener('change', ev_ => {
    if (ev_.target.matches('[data-line]')) { const st = altState(gm); st.line = +ev_.target.value; store.set(`${gm.id}:alt`, st); renderAlt(card, gm); best(); }
    if (ev_.target.matches('[data-tline]')) { const st = totState(gm); st.line = +ev_.target.value; store.set(`${gm.id}:tot`, st); renderTot(card, gm); best(); }
  });
  card.addEventListener('click', ev_ => {
    const b = ev_.target.closest('[data-side]');
    if (b) {
      const st = altState(gm);
      if (st.side !== b.dataset.side) { st.side = b.dataset.side; st.line = -st.line; }
      store.set(`${gm.id}:alt`, st);
      card.querySelectorAll('[data-side]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.side === st.side)));
      $('[data-line]', card).value = String(st.line);
      renderAlt(card, gm); best();
      return;
    }
    const tb = ev_.target.closest('[data-tside]');
    if (tb) {
      const st = totState(gm); st.side = tb.dataset.tside; store.set(`${gm.id}:tot`, st);
      card.querySelectorAll('[data-tside]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.tside === st.side)));
      renderTot(card, gm); best();
      return;
    }
    const tr = ev_.target.closest('[data-tladder]');
    if (tr) {
      const st = totState(gm); st.line = +tr.dataset.tladder; store.set(`${gm.id}:tot`, st);
      const sel = $('[data-tline]', card);
      if (![...sel.options].some(o => +o.value === st.line)) sel.insertAdjacentHTML('beforeend', `<option value="${st.line}">${st.line.toFixed(1)}</option>`);
      sel.value = String(st.line);
      renderTot(card, gm); best();
      $('[data-tot]', card).scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    const r = ev_.target.closest('[data-ladder]');
    if (r) {
      const hHome = +r.dataset.ladder, st = altState(gm);
      st.line = st.side === 'home' ? hHome : -hHome;
      store.set(`${gm.id}:alt`, st);
      $('[data-line]', card).value = String(st.line);
      renderAlt(card, gm); best();
      $('[data-alt]', card).scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  });
}

function render() {
  const root = $('#games');
  $('#filter').hidden = !DATA.games.length;
  $('#nomatch').hidden = true;
  if (!DATA.games.length) { root.innerHTML = `<p class="panel empty">No upcoming games in the data yet. Run the ${esc(DATA.league || '')} predictions to fill this tab.</p>`; best(); return; }
  root.innerHTML = DATA.games.map(cardHTML).join('');
  DATA.games.forEach(gm => { const card = $(`#g-${CSS.escape(gm.id)}`); renderAlt(card, gm); renderTot(card, gm); wire(card, gm); });
  setupFilter();
  best();
}

// ---- filter and sort: team, conference, day, pick strength; kickoff order or strongest first ----
const LEVEL_RANK = { 'Strong': 3, 'Solid': 2, 'Lean': 1, 'Toss-up': 0 };
const dayKey = gm => String(gm.tip_iso || '').slice(0, 10);              // local (Melbourne) date
const dayLabel = gm => String(gm.tip || '').split(',')[0];
const pickWin = gm => Math.max(gm.home.win, gm.away.win);
function setupFilter() {
  const groups = [...new Set(DATA.games.flatMap(g => [g.home.group, g.away.group]).filter(Boolean))].sort();
  const ranked = DATA.games.some(g => g.home.rank || g.away.rank);
  const f = store.get(`${LEAGUE}:filter`, {});
  $('#grp').hidden = !groups.length && !ranked;
  $('#grp').innerHTML = `<option value="">All ${esc(DATA.group_word || 'conferences')}</option>` + (ranked ? '<option value="@top25">Top 25 teams</option>' : '') +
    groups.map(x => `<option value="${esc(x)}">${esc(x)}</option>`).join('');
  const days = [...new Map(DATA.games.map(g => [dayKey(g), dayLabel(g)])).entries()].filter(([k]) => k).sort();
  $('#day').hidden = days.length < 2;
  $('#day').innerHTML = '<option value="">All days</option>' + days.map(([k, l]) => `<option value="${esc(k)}">${esc(l)}</option>`).join('');
  const pick = (sel, v) => { sel.value = [...sel.options].some(o => o.value === v) ? v : sel.options[0].value; };
  $('#q').value = f.q || '';
  pick($('#grp'), f.grp || '');
  pick($('#day'), f.day || '');
  pick($('#str'), f.str || '');
  pick($('#sort'), f.sort || 'time');
  applyFilter();
}
function applyFilter() {
  const q = $('#q').value.trim().toLowerCase(), grp = $('#grp').value, day = $('#day').value;
  const minRank = $('#str').value === '' ? -1 : +$('#str').value, sort = $('#sort').value;
  store.set(`${LEAGUE}:filter`, { q: $('#q').value, grp, day, str: $('#str').value, sort });
  const t = gm => Date.parse(gm.tip_iso) || 0;
  const order = [...DATA.games].sort(sort === 'late' ? (a, b) => t(b) - t(a)
    : sort === 'strong' ? (a, b) => b.signal.bars - a.signal.bars || pickWin(b) - pickWin(a) || t(a) - t(b)
    : (a, b) => t(a) - t(b));
  const root = $('#games');
  let n = 0;
  order.forEach(gm => {
    const sides = [gm.home, gm.away];
    const okQ = !q || sides.some(s => [s.short, s.name, s.code].some(v => String(v || '').toLowerCase().includes(q)));
    const okG = !grp || (grp === '@top25' ? sides.some(s => s.rank) : sides.some(s => s.group === grp));
    const okD = !day || dayKey(gm) === day;
    const okS = minRank < 0 || (LEVEL_RANK[gm.signal.level] ?? 0) >= minRank;
    const card = $(`#g-${CSS.escape(gm.id)}`);
    card.hidden = !(okQ && okG && okD && okS);
    root.appendChild(card);                              // re-append in the chosen order
    n += !card.hidden;
  });
  $('#nomatch').hidden = n > 0;
  $('#shown').textContent = `${n} of ${DATA.games.length} games`;
}
$('#q').addEventListener('input', applyFilter);
['#grp', '#day', '#str', '#sort'].forEach(s => $(s).addEventListener('change', applyFilter));
$('#clearf').addEventListener('click', () => {

const SHARED_ODDS_URL = 'https://raw.githubusercontent.com/valuevault-epl/lineboard-requests/odds/odds.json';

<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
// Update check: on open, whenever the app comes back to the screen, and every minute while it is
// showing. The GitHub API has a new push within seconds; an unchanged file costs nothing (304).
(function () {
  var API = 'https://api.github.com/repos/valuevault-epl/lineboard/contents/data.json?ref=main';
  var busy = false;
  function get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function set(k, v) { try { localStorage.setItem(k, v); return localStorage.getItem(k) === v; } catch (e) { return false; } }
  function fromApi() {
    var h = { 'Accept': 'application/vnd.github.raw+json' };
    var tag = get('lineboard:etag');
    if (tag) h['If-None-Match'] = tag;
    return fetch(API, { cache: 'no-store', headers: h }).then(function (r) {
      if (r.status === 304) return null;
      if (!r.ok) throw new Error('GitHub API ' + r.status);
      return r.json().then(function (d) { return { d: d, tag: r.headers.get('ETag') }; });
    });
  }
  function fromPages() {        // slower to update, used only if the API is unavailable
    return fetch('data.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json().then(function (d) { return { d: d }; }) : null; });
  }
  function check() {
    if (busy || location.protocol !== 'https:' || navigator.onLine === false) return;
    busy = true;
    fromApi().catch(fromPages).then(function (res) {
      if (!res || !res.d || !res.d.stamp || !(res.d.stamp > window.__lbBuilt)) return;
      // only reload once the new data is safely stored, so a full or blocked storage can't loop
      if (set('lineboard:fresh', JSON.stringify({ stamp: res.d.stamp, leagues: res.d.leagues }))) {
        if (res.tag) set('lineboard:etag', res.tag);
        location.reload();
      }
    }).catch(function () {}).then(function () { busy = false; });
  }
  check();
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') check(); });
  window.addEventListener('pageshow', function (e) { if (e.persisted) check(); });
  window.addEventListener('online', check);
  setInterval(function () { if (document.visibilityState === 'visible') check(); }, 60000);
})();
